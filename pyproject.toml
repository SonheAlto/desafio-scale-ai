[project]
name = "desafio-cinema"
version = "0.1.0"
description = "Desafio do workshop Scale IA — sistema de agentes sobre cinema"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[google,openai]>=1.0",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
build = ["pandas>=2.2", "pyarrow>=17"]
obs = ["logfire>=3.0"]  # opcional: so precisa se for usar Logfire (LOGFIRE_TOKEN)

[tool.uv]
package = false
